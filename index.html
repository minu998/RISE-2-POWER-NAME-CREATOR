<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>R2P · Guild Name Creator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
                   RESET & BASE
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a12;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ============================================================
                   AMBIENT BACKGROUND
                   ============================================================ */
        .bg-ambient {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(88, 70, 200, 0.06), transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(255, 107, 138, 0.04), transparent 50%),
                #0a0a12;
        }

        .bg-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            animation: glowMove 12s ease-in-out infinite alternate;
        }

        .bg-glow.g1 {
            top: -100px;
            right: -100px;
            background: #5846c8;
            animation-delay: 0s;
        }

        .bg-glow.g2 {
            bottom: -100px;
            left: -100px;
            background: #ff6b8a;
            animation-delay: 6s;
        }

        @keyframes glowMove {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.2);
            }
        }

        /* ============================================================
                   WELCOME OVERLAY
                   ============================================================ */
        .welcome-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(10, 10, 18, 0.96);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 24px;
            padding: 24px;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .welcome-overlay.hidden {
            opacity: 0;
            transform: scale(0.98);
            pointer-events: none;
        }

        .welcome-content {
            text-align: center;
            max-width: 420px;
            animation: welcomeIn 0.7s ease;
        }

        @keyframes welcomeIn {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-icon {
            font-size: 64px;
            display: block;
            margin-bottom: 4px;
            opacity: 0.5;
            animation: iconFloat 4s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .welcome-title {
            font-size: 36px;
            font-weight: 800;
            color: #f0ecff;
            letter-spacing: -0.5px;
            line-height: 1.1;
        }

        .welcome-title .highlight {
            background: linear-gradient(135deg, #8b7fc7, #5846c8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-title .light {
            font-weight: 300;
            color: #6a6a7e;
            -webkit-text-fill-color: #6a6a7e;
        }

        .welcome-sub {
            color: #6a6a7e;
            font-size: 15px;
            margin: 6px 0 18px;
            line-height: 1.7;
        }

        .welcome-sub span {
            color: #b0a8d0;
        }

        .welcome-btn {
            padding: 14px 48px;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #8b7fc7, #5846c8);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .welcome-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #9c8fd6, #6a5ad8);
            opacity: 0;
            transition: 0.3s;
        }

        .welcome-btn:hover::before {
            opacity: 1;
        }

        .welcome-btn span {
            position: relative;
            z-index: 1;
        }

        .welcome-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 32px rgba(88, 70, 200, 0.15);
        }

        /* ============================================================
                   MAIN CARD
                   ============================================================ */
        .card {
            max-width: 560px;
            width: 100%;
            background: rgba(16, 16, 28, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 36px;
            padding: 32px 28px 28px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.02);
            position: relative;
            z-index: 1;
            animation: cardIn 0.6s ease;
        }

        @keyframes cardIn {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Card accent line */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(139, 127, 199, 0.2), transparent);
            border-radius: 36px 36px 0 0;
        }

        /* ============================================================
                   HEADER
                   ============================================================ */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .logo-wrapper {
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s ease;
        }

        .logo-wrapper:hover {
            border-color: rgba(139, 127, 199, 0.1);
            transform: scale(1.02);
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            display: block;
        }

        .header-text {
            flex: 1;
        }

        .header-text h1 {
            font-size: 22px;
            font-weight: 700;
            color: #f0ecff;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }

        .header-text h1 .muted {
            font-weight: 400;
            color: #6a6a7e;
        }

        .header-text .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: #6a6a7e;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            font-weight: 600;
            margin-top: 2px;
        }

        .header-text .badge .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #8b7fc7;
            display: inline-block;
            animation: dotPulse 2s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
        }

        /* ============================================================
                   INPUT SECTION
                   ============================================================ */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 48px 16px 20px;
            border-radius: 60px;
            border: 1.5px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.02);
            color: #f0ecff;
            font-size: 18px;
            font-weight: 500;
            text-align: left;
            letter-spacing: 2px;
            text-transform: uppercase;
            outline: none;
            transition: 0.3s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .input-wrapper input:focus {
            border-color: rgba(139, 127, 199, 0.15);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 0 4px rgba(139, 127, 199, 0.02);
        }

        .input-wrapper input::placeholder {
            color: #3a3a4e;
            font-size: 14px;
            letter-spacing: 1px;
            font-weight: 400;
            text-transform: none;
        }

        .input-wrapper .clear-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #4a4a5e;
            cursor: pointer;
            font-size: 15px;
            display: none;
            padding: 4px;
            transition: 0.2s;
        }

        .input-wrapper .clear-btn:hover {
            color: #8b7fc7;
        }

        .input-wrapper .clear-btn.visible {
            display: block;
        }

        .btn-generate {
            flex-shrink: 0;
            padding: 16px 24px;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #8b7fc7, #5846c8);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            box-shadow: 0 4px 20px rgba(88, 70, 200, 0.08);
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(88, 70, 200, 0.12);
        }

        .btn-generate:active {
            transform: scale(0.96);
        }

        .btn-generate:disabled {
            opacity: 0.3;
            transform: none !important;
            pointer-events: none;
        }

        /* ============================================================
                   ACTION ROW (Random + Stats)
                   ============================================================ */
        .action-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn-random {
            background: none;
            border: none;
            color: #4a4a5e;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 40px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .btn-random:hover {
            color: #b0a8d0;
            background: rgba(255, 255, 255, 0.02);
        }

        .btn-random i {
            font-size: 13px;
            transition: 0.3s;
        }

        .btn-random:hover i {
            transform: rotate(180deg);
        }

        /* ============================================================
                   RESULT BOX
                   ============================================================ */
        .result-box {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 24px;
            padding: 24px 18px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: 0.4s ease;
            margin-bottom: 18px;
        }

        .result-box.active {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(139, 127, 199, 0.06);
            box-shadow: 0 0 40px rgba(88, 70, 200, 0.02);
        }

        .placeholder-text {
            color: #3a3a4e;
            font-size: 15px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .placeholder-text i {
            opacity: 0.3;
        }

        .result-box.active .placeholder-text {
            display: none;
        }

        #fullName {
            color: #f0ecff;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 3px;
            word-break: break-word;
            line-height: 1.3;
            opacity: 0;
            transform: scale(0.95) translateY(4px);
            transition: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .result-box.active #fullName {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .char-counter {
            position: absolute;
            bottom: 10px;
            right: 14px;
            color: #3a3a4e;
            font-size: 10px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.02);
            padding: 2px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: 0.3s;
        }

        .result-box.active .char-counter {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.03);
        }

        /* ============================================================
                   STATS ROW
                   ============================================================ */
        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 18px;
            min-height: 28px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.02);
            border-radius: 40px;
            padding: 4px 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #4a4a5e;
            opacity: 0;
            transform: translateY(4px);
            transition: 0.5s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .stats-row.active .stat-item {
            opacity: 1;
            transform: translateY(0);
        }

        .stat-item .stat-value {
            color: #b0a8d0;
            font-weight: 600;
            min-width: 16px;
        }

        .stat-item i {
            font-size: 11px;
            opacity: 0.3;
        }

        .coolness-bar {
            width: 44px;
            height: 3px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            overflow: hidden;
            display: inline-block;
        }

        .coolness-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #8b7fc7, #5846c8);
            border-radius: 4px;
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 0%;
        }

        /* ============================================================
                   BUTTON ROW
                   ============================================================ */
        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn-action {
            padding: 12px 28px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            background: rgba(255, 255, 255, 0.02);
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s ease;
            color: #6a6a7e;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #f0ecff;
            border-color: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
        }

        .btn-action:active {
            transform: scale(0.96);
        }

        .btn-action:disabled {
            opacity: 0.2;
            pointer-events: none;
            transform: none !important;
        }

        .btn-copy.copied {
            background: rgba(60, 160, 100, 0.06);
            border-color: rgba(60, 160, 100, 0.08);
            color: #6a9a7a;
        }

        .btn-copy.copied i {
            color: #6a9a7a;
            opacity: 1;
        }

        /* ============================================================
                   CONTACT SECTION
                   ============================================================ */
        .contact-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
        }

        .contact-label {
            color: #4a4a5e;
            font-size: 11px;
            letter-spacing: 0.5px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .contact-label i {
            font-size: 12px;
            opacity: 0.3;
        }

        .btn-whatsapp {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            color: #6a6a7e;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s ease;
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .btn-whatsapp:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #b0a8d0;
            border-color: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
        }

        .btn-whatsapp i {
            font-size: 16px;
            opacity: 0.4;
            transition: 0.3s;
        }

        .btn-whatsapp:hover i {
            opacity: 0.8;
        }

        /* ============================================================
                   LOADING
                   ============================================================ */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 18, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 24px;
            z-index: 999;
        }

        .loading-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(255, 255, 255, 0.02);
            border-top: 2px solid #8b7fc7;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.6, 0, 0.4, 1) infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #4a4a5e;
            font-size: 13px;
            letter-spacing: 4px;
            font-weight: 400;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* ============================================================
                   TOAST
                   ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(16, 16, 28, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #f0ecff;
            padding: 10px 26px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            font-weight: 500;
            font-size: 13px;
            opacity: 0;
            transition: 0.4s ease;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ============================================================
                   RESPONSIVE
                   ============================================================ */
        @media (max-width: 540px) {
            .card {
                padding: 24px 18px 20px;
                border-radius: 28px;
            }

            .logo-wrapper {
                width: 44px;
                height: 44px;
            }

            .header-text h1 {
                font-size: 18px;
            }

            .input-wrapper input {
                font-size: 16px;
                padding: 14px 44px 14px 16px;
                letter-spacing: 2px;
            }

            .btn-generate {
                padding: 14px 18px;
                font-size: 13px;
            }

            #fullName {
                font-size: 24px;
                letter-spacing: 2px;
            }

            .btn-action {
                padding: 10px 20px;
                font-size: 12px;
            }

            .stats-row .stat-item {
                font-size: 11px;
                padding: 3px 12px;
            }

            .result-box {
                padding: 18px 14px;
                min-height: 68px;
            }

            .toast {
                font-size: 12px;
                padding: 8px 18px;
                white-space: normal;
                max-width: 92%;
            }

            .welcome-title {
                font-size: 28px;
            }

            .welcome-icon {
                font-size: 48px;
            }

            .welcome-sub {
                font-size: 14px;
            }

            .welcome-btn {
                padding: 12px 36px;
                font-size: 14px;
            }

            .coolness-bar {
                width: 32px;
            }

            .contact-section {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .btn-whatsapp {
                justify-content: center;
            }

            .action-row {
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
            }

            .btn-random {
                justify-content: center;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 16px 12px 14px;
                border-radius: 20px;
            }

            .header-text h1 {
                font-size: 15px;
            }

            #fullName {
                font-size: 18px;
                letter-spacing: 1.5px;
            }

            .input-wrapper input {
                font-size: 14px;
                padding: 12px 36px 12px 14px;
                letter-spacing: 1.5px;
            }

            .btn-generate {
                padding: 12px 14px;
                font-size: 11px;
            }

            .btn-action {
                padding: 8px 14px;
                font-size: 11px;
            }

            .stat-item {
                font-size: 10px;
                padding: 2px 10px;
            }

            .coolness-bar {
                width: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== BACKGROUND ===== -->
    <div class="bg-ambient"></div>
    <div class="bg-glow g1"></div>
    <div class="bg-glow g2"></div>

    <!-- ===== WELCOME OVERLAY ===== -->
    <div class="welcome-overlay" id="welcomeOverlay">
        <div class="welcome-content">
            <span class="welcome-icon">✦</span>
            <h1 class="welcome-title">
                RICE <span class="highlight">2</span> <span class="light">POWER</span>
            </h1>
            <p class="welcome-sub">
                Welcome to the <span>Guild Name Creator</span><br />
                Craft your legendary identity
            </p>
            <button class="welcome-btn" id="welcomeBtn">
                <span>ENTER</span>
            </button>
        </div>
    </div>

    <!-- ===== LOADING OVERLAY ===== -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">GENERATING</div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ===== MAIN CARD ===== -->
    <div class="card" id="mainCard">

        <!-- HEADER -->
        <div class="header">
            <div class="logo-wrapper">
                <img src="https://files.catbox.moe/gg2h1d.png" alt="Logo" />
            </div>
            <div class="header-text">
                <h1>
                    R2P <span class="muted">NAME</span>
                </h1>
                <span class="badge">
                    <span class="dot"></span>
                    GUILD NAME CREATOR
                </span>
            </div>
        </div>

        <!-- INPUT -->
        <div class="input-section">
            <div class="input-row">
                <div class="input-wrapper">
                    <input type="text" id="nameInput" placeholder="Type your name" maxlength="6" autofocus spellcheck="false" autocomplete="off" />
                    <button class="clear-btn" id="clearBtn"><i class="fas fa-times-circle"></i></button>
                </div>
                <button class="btn-generate" id="generateBtn">
                    <i class="fas fa-bolt"></i> GENERATE
                </button>
            </div>
        </div>

        <!-- ACTION ROW -->
        <div class="action-row">
            <button class="btn-random" id="randomBtn">
                <i class="fas fa-dice"></i> RANDOM
            </button>
        </div>

        <!-- RESULT -->
        <div class="result-box" id="resultBox">
            <span class="placeholder-text"><i class="fas fa-feather-alt"></i> await your name</span>
            <span id="fullName"></span>
            <span class="char-counter" id="charCount">0 / 6</span>
        </div>

        <!-- STATS -->
        <div class="stats-row" id="statsRow">
            <span class="stat-item" id="statLength">
                <i class="fas fa-ruler"></i> <span class="stat-value" id="statLengthValue">0</span>
            </span>
            <span class="stat-item" id="statLetters">
                <i class="fas fa-font"></i> <span class="stat-value" id="statLettersValue">0</span>
            </span>
            <span class="stat-item" id="statCoolness">
                <i class="fas fa-star"></i>
                <span class="stat-value" id="statCoolnessValue">0/100</span>
                <span class="coolness-bar"><span class="fill" id="coolnessFill"></span></span>
            </span>
        </div>

        <!-- BUTTON ROW -->
        <div class="button-row">
            <button class="btn-action btn-copy" id="copyBtn" disabled>
                <i class="fas fa-copy"></i> COPY
            </button>
            <button class="btn-action" id="resetBtn">
                <i class="fas fa-undo-alt"></i> RESET
            </button>
        </div>

        <!-- CONTACT -->
        <div class="contact-section">
            <span class="contact-label">
                <i class="fas fa-flag"></i> GUILD LEADER
            </span>
            <button class="btn-whatsapp" id="whatsappBtn">
                <i class="fab fa-whatsapp"></i> CONTACT
            </button>
        </div>

    </div>

    <script>
        (function() {
            // ===== DOM =====
            const nameInput = document.getElementById('nameInput');
            const generateBtn = document.getElementById('generateBtn');
            const randomBtn = document.getElementById('randomBtn');
            const fullNameSpan = document.getElementById('fullName');
            const resultBox = document.getElementById('resultBox');
            const charCount = document.getElementById('charCount');
            const copyBtn = document.getElementById('copyBtn');
            const resetBtn = document.getElementById('resetBtn');
            const clearBtn = document.getElementById('clearBtn');
            const toast = document.getElementById('toast');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const statLengthValue = document.getElementById('statLengthValue');
            const statLettersValue = document.getElementById('statLettersValue');
            const statCoolnessValue = document.getElementById('statCoolnessValue');
            const coolnessFill = document.getElementById('coolnessFill');
            const statsRow = document.getElementById('statsRow');
            const whatsappBtn = document.getElementById('whatsappBtn');
            const welcomeOverlay = document.getElementById('welcomeOverlay');
            const welcomeBtn = document.getElementById('welcomeBtn');

            // ===== CONSTANTS =====
            const MAX = 6;
            const PREFIX = 'Ｒ2Ｐㅤ';
            const SUFFIX = 'ㅤ愛';
            const LOADING_DELAY = 700;

            // ===== RANDOM NAMES =====
            const REAL_NAMES = [
                'JAMES', 'MICHAEL', 'ROBERT', 'JOHN', 'DAVID', 'WILLIAM', 'RICHARD',
                'THOMAS', 'CHARLES', 'CHRISTOPHER', 'DANIEL', 'MATTHEW', 'ANTHONY',
                'MARK', 'PAUL', 'STEVEN', 'ANDREW', 'KENNETH', 'JOSHUA', 'KEVIN',
                'GEORGE', 'TIMOTHY', 'RONALD', 'EDWARD', 'JASON', 'JEFFREY', 'RYAN',
                'GARY', 'NICHOLAS', 'ERIC', 'JONATHAN', 'STEPHEN', 'LARRY', 'JUSTIN',
                'BRANDON', 'BENJAMIN', 'SAMUEL', 'GREGORY', 'FRANK', 'ALEXANDER',
                'JACK', 'DENNIS', 'JERRY', 'TYLER', 'AARON', 'JOSE', 'ADAM', 'NATHAN',
                'HENRY', 'CARL', 'ARTHUR', 'ROGER', 'JOE', 'JUAN', 'JESSE', 'NOAH',
                'LIAM', 'MASON', 'ETHAN', 'LOGAN', 'OLIVER', 'ELIJAH', 'MAXWELL',
                'RAVEN', 'FALCON', 'WOLF', 'TIGER', 'SHADOW', 'STORM', 'BLAZE',
                'FROST', 'NIGHT', 'VENOM', 'REAPER', 'LEGEND', 'MYTH', 'VIPER',
                'CRIMSON', 'STEEL', 'DARK', 'GHOST', 'RYDER', 'ZION', 'NOVA',
                'ORION', 'SAGE', 'ZERO', 'AXEL', 'DRAVEN', 'JAX', 'KANE', 'REN',
                'VICE', 'WRATH', 'FURY', 'RAGE', 'HUNTER', 'RAVI', 'ARJUN',
                'VIKRAM', 'KARAN', 'RISHI', 'DEV', 'ARYA', 'NEEL', 'KIRAN',
                'MANOJ', 'SUNIL', 'RAJ', 'AMAN', 'GAURAV', 'NIKHIL', 'ROHAN',
                'MOHAN', 'SURESH', 'HARSH', 'DEEPAK', 'ANAND', 'VIJAY', 'AJAY',
                'SANJAY', 'KUMAR', 'SIDDHARTH', 'DHRUV', 'YASH', 'ARAV', 'ISHAN',
                'AARAV', 'VIAAN', 'ADVIK', 'ANAY', 'RUDRA', 'KIAAN', 'ARYAN',
                'SHIV', 'OM', 'JAI', 'KAVYA', 'ANIKA', 'DIYAA', 'MYRA', 'ISHA',
                'ANAYA', 'RIA', 'SIYA', 'TARA', 'ZARA', 'LEELA', 'MEERA', 'RADHA',
                'SITA', 'PARVATI', 'LAKSHMI', 'SARASWATI', 'DURGA', 'KALI',
                'GANESH', 'SHIVA', 'ZACK', 'JAX', 'REX', 'MAX', 'ZEN', 'VEX',
                'LYNX', 'PHOENIX', 'TITAN', 'OMEGA', 'ALPHA', 'BETA', 'GAMMA',
                'DELTA', 'SIGMA', 'VEGA', 'POLARIS', 'SIRIUS', 'RIGEL', 'ARCTURUS'
            ];

            // ===== WELCOME =====
            welcomeBtn.addEventListener('click', function() {
                welcomeOverlay.classList.add('hidden');
                setTimeout(() => {
                    welcomeOverlay.style.display = 'none';
                    nameInput.focus();
                }, 500);
            });

            // ===== TOAST =====
            let toastTimer;

            function showToast(msg, dur = 1400) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove('show'), dur);
            }

            // ===== FULL-WIDTH =====
            function toFullWidth(str) {
                return str.replace(/[A-Za-z]/g, ch => {
                    const code = ch.charCodeAt(0);
                    if (code >= 65 && code <= 90) return String.fromCharCode(code + 0xFEE0);
                    if (code >= 97 && code <= 122) return String.fromCharCode(code + 0xFEE0);
                    return ch;
                });
            }

            // ===== UPDATE STATS =====
            function updateStats(raw) {
                const clean = raw.replace(/[^A-Za-z]/g, '');
                const len = clean.length;
                statLengthValue.textContent = len;
                statLettersValue.textContent = len;

                let score = 0;
                if (len > 0) {
                    score += len * 12;
                    if (len === 6) score += 20;
                    if (len >= 4) score += 10;
                    const unique = new Set(clean.toUpperCase().split('')).size;
                    if (unique >= 4) score += 10;
                    if (unique >= 5) score += 10;
                    score = Math.min(score, 100);
                }
                statCoolnessValue.textContent = score + '/100';
                coolnessFill.style.width = score + '%';

                if (len > 0) statsRow.classList.add('active');
                else statsRow.classList.remove('active');
            }

            // ===== GENERATE =====
            function generateNameCore(inputValue) {
                let raw = inputValue.replace(/[^A-Za-z]/g, '');
                if (raw.length > MAX) raw = raw.slice(0, MAX);
                nameInput.value = raw;
                charCount.textContent = `${raw.length} / ${MAX}`;
                clearBtn.classList.toggle('visible', raw.length > 0);

                if (raw.length === 0) {
                    resultBox.classList.remove('active');
                    fullNameSpan.textContent = '';
                    copyBtn.disabled = true;
                    updateStats('');
                    return null;
                }

                const upper = raw.toUpperCase();
                const fullWidth = toFullWidth(upper);
                const full = PREFIX + fullWidth + SUFFIX;
                fullNameSpan.textContent = full;
                resultBox.classList.add('active');
                copyBtn.disabled = false;
                updateStats(raw);
                return full;
            }

            // ===== WITH LOADING =====
            function generateWithLoading() {
                const raw = nameInput.value.trim();
                if (raw.length === 0) {
                    showToast('Type a name first', 1200);
                    nameInput.focus();
                    return;
                }

                generateBtn.disabled = true;
                loadingOverlay.classList.add('active');

                setTimeout(() => {
                    generateNameCore(raw);
                    loadingOverlay.classList.remove('active');
                    generateBtn.disabled = false;
                    if (fullNameSpan.textContent) showToast('✦ Generated', 700);
                }, LOADING_DELAY);
            }

            // ===== RANDOM =====
            function applyRandom() {
                const randomIndex = Math.floor(Math.random() * REAL_NAMES.length);
                const randomName = REAL_NAMES[randomIndex];
                nameInput.value = randomName;
                clearBtn.classList.add('visible');

                generateBtn.disabled = true;
                loadingOverlay.classList.add('active');

                setTimeout(() => {
                    generateNameCore(randomName);
                    loadingOverlay.classList.remove('active');
                    generateBtn.disabled = false;
                    if (fullNameSpan.textContent) showToast('🎲 Random', 700);
                }, LOADING_DELAY);
            }

            // ===== EVENTS =====
            generateBtn.addEventListener('click', generateWithLoading);
            randomBtn.addEventListener('click', applyRandom);

            nameInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    generateBtn.click();
                }
            });

            nameInput.addEventListener('input', function() {
                let val = this.value;
                const filtered = val.replace(/[^A-Za-z]/g, '');
                if (val !== filtered) {
                    this.value = filtered;
                    showToast('English only', 800);
                }
                if (this.value.length > MAX) this.value = this.value.slice(0, MAX);
                charCount.textContent = `${this.value.length} / ${MAX}`;
                clearBtn.classList.toggle('visible', this.value.length > 0);

                if (this.value.length === 0) {
                    resultBox.classList.remove('active');
                    fullNameSpan.textContent = '';
                    copyBtn.disabled = true;
                    statsRow.classList.remove('active');
                    statLengthValue.textContent = '0';
                    statLettersValue.textContent = '0';
                    statCoolnessValue.textContent = '0/100';
                    coolnessFill.style.width = '0%';
                }
            });

            clearBtn.addEventListener('click', function() {
                nameInput.value = '';
                charCount.textContent = `0 / ${MAX}`;
                clearBtn.classList.remove('visible');
                resultBox.classList.remove('active');
                fullNameSpan.textContent = '';
                copyBtn.disabled = true;
                statsRow.classList.remove('active');
                statLengthValue.textContent = '0';
                statLettersValue.textContent = '0';
                statCoolnessValue.textContent = '0/100';
                coolnessFill.style.width = '0%';
                nameInput.focus();
                showToast('↺ Cleared', 500);
            });

            copyBtn.addEventListener('click', async function() {
                const text = fullNameSpan.textContent;
                if (!text) return;
                try {
                    await navigator.clipboard.writeText(text);
                    copyBtn.classList.add('copied');
                    copyBtn.innerHTML = '<i class="fas fa-check"></i> COPIED';
                    showToast(`📋 "${text}" copied`, 1400);
                    setTimeout(() => {
                        copyBtn.classList.remove('copied');
                        copyBtn.innerHTML = '<i class="fas fa-copy"></i> COPY';
                    }, 1800);
                } catch {
                    const range = document.createRange();
                    range.selectNode(fullNameSpan);
                    window.getSelection().removeAllRanges();
                    window.getSelection().addRange(range);
                    document.execCommand('copy');
                    window.getSelection().removeAllRanges();
                    copyBtn.classList.add('copied');
                    copyBtn.innerHTML = '<i class="fas fa-check"></i> COPIED';
                    showToast('📋 Copied', 1200);
                    setTimeout(() => {
                        copyBtn.classList.remove('copied');
                        copyBtn.innerHTML = '<i class="fas fa-copy"></i> COPY';
                    }, 1800);
                }
            });

            resetBtn.addEventListener('click', function() {
                nameInput.value = '';
                charCount.textContent = `0 / ${MAX}`;
                clearBtn.classList.remove('visible');
                resultBox.classList.remove('active');
                fullNameSpan.textContent = '';
                copyBtn.disabled = true;
                statsRow.classList.remove('active');
                statLengthValue.textContent = '0';
                statLettersValue.textContent = '0';
                statCoolnessValue.textContent = '0/100';
                coolnessFill.style.width = '0%';
                nameInput.focus();
                showToast('↺ Reset', 500);
            });

            nameInput.addEventListener('paste', function(e) {
                e.preventDefault();
                const pasted = (e.clipboardData || window.clipboardData).getData('text');
                const filtered = pasted.replace(/[^A-Za-z]/g, '');
                const final = filtered.slice(0, MAX);
                this.value = final;
                charCount.textContent = `${final.length} / ${MAX}`;
                clearBtn.classList.toggle('visible', final.length > 0);
                if (filtered.length !== pasted.length) showToast('English only', 800);
            });

            // ===== WHATSAPP =====
            whatsappBtn.addEventListener('click', function(e) {
                e.preventDefault();
                window.open('https://wa.link/0tzlod', '_blank');
            });

            // ===== INIT =====
            window.addEventListener('DOMContentLoaded', function() {
                welcomeOverlay.style.display = 'flex';
                const card = document.getElementById('mainCard');
                card.style.opacity = '0';
                card.style.transform = 'scale(0.96)';
                card.style.transition = 'opacity 0.6s ease, transform 0.6s ease';

                welcomeBtn.addEventListener('click', function() {
                    card.style.opacity = '1';
                    card.style.transform = 'scale(1)';
                });

                resultBox.classList.remove('active');
                fullNameSpan.textContent = '';
                copyBtn.disabled = true;
                charCount.textContent = `0 / ${MAX}`;
                statsRow.classList.remove('active');
                coolnessFill.style.width = '0%';
                clearBtn.classList.remove('visible');
            });

        })();
    </script>

</body>
</html>
